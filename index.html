<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Drift Max</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
}

.layout {
  display: grid;
  grid-template-columns: 250px 1fr;
  height: 100vh;
  border: 5px solid white;
}

.left {
  display: grid;
  grid-template-rows: 250px 1fr;
  border-right: 5px solid black;
}

.logo {
  border-bottom: 5px solid black;
  height: 250px;
  overflow: hidden;
}

.logo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.menu {
  padding: 10px;
  display: flex;
  flex-direction: column;
  height: 100%;
}

.menu button {
  width: 100%;
  margin-bottom: 10px;
  padding: 8px;
  cursor: pointer;
}

.qr-lateral {
  text-align: center;
  margin-top: 10px;
}

.qr-lateral img {
  width: 120px;
}

.menu button.tema-final {
  margin-top: auto;
}

.right {
  display: grid;
  grid-template-rows: 250px 1fr;
}

.video {
  border-bottom: 5px solid black;
  height: 250px;
  overflow: hidden;
}

.video video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.texto {
  padding: 20px;
  font-size: 18px;
}
</style>
</head>

<body>

<div class="layout">

  <div class="left">
    <div class="logo">
      <img src="logo.png" alt="Logo Drift">
    </div>

    <div class="menu">
      <button onclick="mostrarTexto(1)">Ultimate Drift</button>
      <button onclick="mostrarTexto(2)">Eu no ultimate</button>
      <button onclick="mostrarTexto(3)">Enzo Gregório</button>
      <button onclick="mostrarTexto(4)">Med Max Marrow</button>
      <button onclick="mostrarTexto(5)">Sites de Drift</button>

      <div class="qr-lateral">
        <p><strong>QR Drift Max</strong></p>
        <img src="qrdriftmax.png" alt="QR Drift Max">
      </div>

      <button class="tema-final" onclick="mostrarTexto(6)">Login</button>
    </div>
  </div>

  <div class="right">
    <div class="video">
      <video controls>
        <source src="video.mp4" type="video/mp4">
      </video>
    </div>

    <div class="texto" id="texto">
      As informações vão aparecer aqui.
    </div>
  </div>

</div>

<script>

function mostrarTexto(tema) {
  const texto = document.getElementById("texto");

  if (tema === 1) {
    texto.innerText = "Ultimate Drift é um evento automotivo voltado para os apaixonados por drift...";
  } 

  else if (tema === 2) {
    texto.innerHTML = '<img src="valen.jpeg" style="width:300px;">';
  } 

  else if (tema === 3) {
    texto.innerText = "Enzo Gregorio é um jovem piloto de kart focado em velocidade...";
  }

  else if (tema === 4) {
    texto.innerHTML = '<img src="marrow.jpeg" style="width:300px;">';
  } 

  else if (tema === 5) {
    texto.innerHTML = `
      <h2>Sites de Drift</h2><br>
      <img src="qr-sites.png" style="width:200px;">
    `;
  }

  else if (tema === 6) {
    texto.innerHTML = `
      <div style="text-align:center; margin-top:40px;">
        <h2>Login Drift Max</h2><br>
        <input id="nome" placeholder="Nome"><br><br>
        <input id="senha" type="password" placeholder="Senha"><br><br>
        <button onclick="guardar()">Salvar</button>
      </div>
    `;
  }
}

function guardar() {
  const nome = document.getElementById("nome").value;
  const senha = document.getElementById("senha").value;

  console.log("Nome:", nome);
  console.log("Senha:", senha);

  alert("Login salvo no console 😎");
}

</script>

</body>
</html>
